<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>In-Class Exercise: Flexbox + Grid</title>
<link rel="stylesheet" href="ex7.css">
</head>
<body>

<div class="page">
  <nav>
    <div class="logo">Dashboard</div>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Reports</a></li>
      <li><a href="#">Settings</a></li>
    </ul>
  </nav>

  <aside>
    <h3>Filters</h3>
    <ul>
      <li>Last 7 days</li>
      <li>Last 30 days</li>
      <li>Custom range</li>
    </ul>
    <h3>Regions</h3>
    <ul>
      <li>North America</li>
      <li>Europe</li>
      <li>Asia Pacific</li>
    </ul>
  </aside>

  <main>
    <h2>Overview</h2>
    <div class="card-row">
      <div class="card">
        <h4>Total Sales</h4>
        <p>$48,210</p>
      </div>
      <div class="card">
        <h4>New Users</h4>
        <p>1,204</p>
      </div>
      <div class="card">
        <h4>Bounce Rate</h4>
        <p>32%</p>
      </div>
    </div>
  </main>
</div>

</body>
</html>
