<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid</title>
    <style>
      .page {
        display: grid;
        grid-template-columns: 1fr 3fr;
        grid-template-rows: auto 1fr auto;
        grid-template-areas: "header header"
                             "sidebar main"
                             "footer footer";
        color: #420606;
        font-size: 18px;
        font-weight: semi-bold;
        gap: 10px;
        min-height: 90vh;
      }
      header {
        grid-area: header;
        background-color: #dc2626;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      aside {
        grid-area: sidebar;
        background-color: #fca5a5;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        grid-area: main;
        background-color: #fecaca;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 200px;
      }
      footer {
        grid-area: footer;
        background-color: #dc2626;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <h3>header</h3>
      </header>
      <aside>
        <p>aside (1fr)</p>
      </aside>
      <main>
        <p>main (3fr)</p>
      </main>
      <footer>
        <h3>footer</h3>
      </footer>
    </div>
  </body>
</html>
