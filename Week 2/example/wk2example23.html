<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid</title>
    <style>
      .grid-container {
        display: grid;
        grid-template-columns: 200px 1fr 200px;
        grid-template-rows: 60px 1fr 40px;
        gap: 12px;
        min-height: 90vh;
        color: #420606;
        font-size: 18px;
        font-weight: semi-bold;
      }
      header,
      footer {
        grid-column: 1 / 4;
        background-color: #dc2626;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      aside {
        background-color: #fca5a5;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      main {
        background-color: #fecaca;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <header>
        <h3>header (grid-column: 1/4)</h3>
      </header>
      <aside>
        <p>sidebar</p>
      </aside>
      <main>
        <p>main (1fr)</p>
      </main>
      <aside>
        <p>aside</p>
      </aside>
      <footer>
        <h3>footer (grid-column: 1/4)</h3>
      </footer>
    </div>
  </body>
</html>
