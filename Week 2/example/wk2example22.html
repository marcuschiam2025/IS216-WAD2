<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }
        .box1, .box2, .box3 {
            width: 100px;
            height: 100px;
            margin: 20px;
            text-align: center;
        }
        .box1 {
            background-color: #CECBF6;
        }
        .box2 {
            background-color: #9FE1CB;
        }
        .box3 {
            background-color: #F5C4B3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">
            Box 1
        </div>
        <div class="box2">
            Box 2
        </div>
        <div class="box3">
            Box 3
        </div>
    </div>
</body>
</html>
