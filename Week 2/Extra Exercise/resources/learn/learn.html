<!doctype html>
<html>
    <head>
        <style>
            h1 {
                font-family: Arial, Helvetica, sans-serif;
                color: darkmagenta;
            }

            table,
            th,
            td {
                border-radius: 1px;
                border-color: black;
                border-style: solid;
            }

            .hundredpx_margin {
                margin-left: 100px;
            }

            .twohundredpx_margin {
                margin-left: 200px;
            }

            p {
                font-weight: bold;
            }

            #circle_red {
                color: red;
                background-color: lightblue;
                text-align: center;
            }

            #square_green {
                color: green;
                background-color: lightblue;
                text-align: center;
            }

            #triangle_blue {
                color: blue;
                background-color: lightblue;
                text-align: center;
            }

            .special_font {
                text-align: center;
                font-family: "Courier New", Courier, monospace;
                background-color: #fffdd0;
            }

            .black_bg {
                background-color: black;
                text-align: center;
            }

            #blue {
                color: blue;
            }

            #green {
                color: green;
            }

            #yellow {
                color: yellow;
            }

            .hoverover_size:hover {
                font-size: 130%;
            }
        </style>
    </head>

    <body>
        <h1>Learn About Shapes, Colors and Numbers</h1>

        <div>
            <p>Shapes</p>
            <table>
                <tr>
                    <td>
                        <img src="images/circle.jpg" heigth="100" width="100" />
                    </td>
                    <td>
                        <img src="images/square.jpg" heigth="100" width="100" />
                    </td>
                    <td>
                        <img
                            src="images/triangle.jpg"
                            heigth="100"
                            width="100"
                        />
                    </td>
                </tr>
                <tr class="hoverover_size">
                    <td id="circle_red">Circle</td>
                    <td id="square_green">Square</td>
                    <td id="triangle_blue">Triangle</td>
                </tr>
            </table>
        </div>
        <br />
        <div class="hundredpx_margin">
            <p>Numbers</p>
            <table>
                <tr>
                    <td>
                        <img src="images/one.jpg" heigth="100" width="100" />
                    </td>
                    <td>
                        <img src="images/two.jpg" heigth="100" width="100" />
                    </td>
                    <td>
                        <img src="images/three.jpg" heigth="100" width="100" />
                    </td>
                </tr>
                <tr class="special_font hoverover_size">
                    <td>One</td>
                    <td>Two</td>
                    <td>Three</td>
                </tr>
            </table>
        </div>
        <br />
        <div class="twohundredpx_margin">
            <p>Colours</p>
            <table>
                <tr>
                    <td>
                        <img src="images/blue.jpg" heigth="100" width="100" />
                    </td>
                    <td>
                        <img src="images/green.jpg" heigth="100" width="100" />
                    </td>
                    <td>
                        <img src="images/yellow.jpg" heigth="100" width="100" />
                    </td>
                </tr>
                <tr class="black_bg hoverover_size">
                    <td id="blue">Blue</td>
                    <td id="green">Green</td>
                    <td id="yellow">Yellow</td>
                </tr>
            </table>
        </div>
    </body>
</html>
